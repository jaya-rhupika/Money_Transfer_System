<div class="page">
  <div class="shell">

    <!-- Welcome Section -->
    <div class="welcome-banner">
      <h3>Welcome, {{ user?.holderName }} </h3>
    </div>

    <!-- Balance Section -->
    <div class="balance-card">
      <p>Current Balance</p>
      <h1>₹ {{ user?.balance | number:'1.2-2' }}</h1>
    </div>

    <!-- Charts & Stats Section -->
    <div class="charts-section" *ngIf="!statsLoading">
      <div class="chart-container">
        <h3>Transaction Overview</h3>
        <canvas 
          #transactionChart
          class="chart">
        </canvas>
      </div>

      <div class="stats-cards">
        <div class="stat-card sent">
          <div class="stat-label">Total Sent</div>
          <div class="stat-value">₹ {{ stats.totalSent | number:'1.2-2' }}</div>
          <div class="stat-count">{{ stats.sentCount }} transactions</div>
        </div>
        <div class="stat-card received">
          <div class="stat-label">Total Received</div>
          <div class="stat-value">₹ {{ stats.totalReceived | number:'1.2-2' }}</div>
          <div class="stat-count">{{ stats.receivedCount }} transactions</div>
        </div>
      </div>
    </div>

    <!-- Action Buttons (2x2 Grid) -->
    <div class="action-grid">

      <button class="action-card" (click)="goToTransfer()">
        <div class="icon-circle">
          <span class="material-symbols-outlined">sync_alt</span>
        </div>
        <div class="label">Transfer</div>
      </button>

      <button class="action-card" (click)="goToHistory()">
        <div class="icon-circle">
          <span class="material-symbols-outlined">history</span>
        </div>
        <div class="label">History</div>
      </button>

      <button class="action-card" (click)="goToRewards()">
        <div class="icon-circle">
          <span class="material-symbols-outlined">emoji_events</span>
        </div>
        <div class="label">Rewards</div>
      </button>

      <button class="action-card" (click)="goToProfile()">
        <div class="icon-circle">
          <span class="material-symbols-outlined">person</span>
        </div>
        <div class="label">Profile</div>
      </button>

      <button class="action-card logout-card" (click)="logout()">
        <div class="icon-circle logout-icon">
          <span class="material-symbols-outlined">logout</span>
        </div>
        <div class="label">Logout</div>
      </button>

    </div>

  </div>
</div>
