<div class="page">

  <div class="brand">
    <div class="brand-icon">💸</div>
    <div class="brand-name">Money Transfer</div>
  </div>

  <div class="card">
    <h2 class="card-title">Welcome back</h2>
    <p class="card-sub">Sign in with your account number</p>

    <form #loginForm="ngForm" (ngSubmit)="doLogin()">

      <div class="field">
        <label>Account Number</label>
        <input
          type="number"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter your account number"
          required
          autocomplete="off"
        />
      </div>

      <div class="field">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button type="submit" [disabled]="!username || !password || isSubmitting">
        {{ isSubmitting ? 'Signing in…' : 'Sign In' }}
      </button>

    </form>

    <div class="register-link">
      New here? <span (click)="goToRegister()">Create an account</span>
    </div>
  </div>

</div>
